			let currentIndex;
			let showSpanish = true;

			// Fonction pour normaliser les accents et minuscules
			function normalize(str) {
			    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
			}

			// Affiche un mot aléatoire
			function showCard() {
			    if (words.length === 0) {
			        document.getElementById("card").textContent = "🎉 Tous les mots sont appris !";
			        return;
			    }
			    currentIndex = Math.floor(Math.random() * words.length);
			    let word = words[currentIndex];

			    // Espagnol visible, français caché dans la bulle
			    document.getElementById("card").innerHTML = `
			      <span class="tooltip">
			        ${word.es}
			        <span class="tooltiptext">${word.fr.join(" / ")}</span>
			      </span>
			    `;
			}


			// Vérifie la réponse de l'utilisateur
			function checkAnswer() {
			    if (words.length === 0) return;

			    let user = normalize(document.getElementById("answer").value.trim());
			    let correct = showSpanish ? words[currentIndex].fr : [words[currentIndex].es];
			    let isCorrect = correct.some(c => normalize(c) === user);

			    if (isCorrect) {
			        document.getElementById("feedback").textContent = "✅ Bravo !";
			        words.splice(currentIndex, 1); // Supprime le mot correctement répondu
			    } else {
			        document.getElementById("feedback").textContent = "❌ Mauvaise réponse";
			    }

			    document.getElementById("answer").value = "";
			    showCard();
			}

			// Initialisation
			showCard();
